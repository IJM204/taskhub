{% extends "core/base.html" %}

{% block content %}
<h1>Supprimer une tâche</h1>

<p>Voulez-vous vraiment supprimer "{{ object.title }}" ?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
</form>

<a href="{% url 'core:task_list' %}">Annuler</a>
{% endblock %}
