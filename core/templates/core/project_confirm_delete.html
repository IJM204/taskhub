{% extends "core/base.html" %}

{% block content %}
<h1>Supprimer le projet</h1>

<p>
    Voulez-vous vraiment supprimer le projet
    "{{ project.description }}" ?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
</form>

<a href="{% url 'core:organization_detail' project.organization.slug %}">
    Annuler
</a>
{% endblock %}
